apiVersion: apps/v1
kind: Deployment
metadata:
    name: core-backedn-deployment
spec:
    replicas: 1
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: core-backend
    template:
        metadata:
            labels:
                app: core-backend
        spec:
            containers:
                -   name: core-backend-container
                    image: sazzadr/overengineered-blog-core-backend:latest
                    readinessProbe:
                        periodSeconds: 10
                        successThreshold: 5
                        httpGet:
                            port: 8888
                            path: /health
                    livenessProbe:
                        periodSeconds: 60
                        httpGet:
                            port:  8888
                            path: /health

---

apiVersion: v1
kind: Service
metadata:
    name: core-backend-service
spec:
    type: NodePort
    selector:
        app: core-backend
    ports:
        -   port: 8888
            nodePort: 30001
