services:
    core-backend:
        build:
            context: ./core-backend
        image: sazzadr/overengineered-blog/core-backend:latest
        container_name: overengineered-core-backend
        restart: unless-stopped
        ports:
            - "8888:8888"
        volumes:
            - ./core-backend:/home/app
        depends_on:
            - rdbms
        networks:
            - app
    rdbms:
        image: postgres:18.6
        container_name: overengineered-rdbms
        restart: unless-stopped
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=overengineered-blog
        ports:
            - "5432:5432"
        volumes:
            - rdbms-data:/var/lib/postgresql
        networks:
            - app
    k6:
        image: grafana/k6
        container_name: overengineered-loadtest
        volumes:
            - ./k6:/scripts
        profiles:
            - testing
        depends_on:
            - core-backend
        networks:
            - app

volumes:
    rdbms-data:
